<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>donutzach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6fb0;
    --purple: #c77dff;
    --gold: #ffd166;
    --cyan: #4cd3ff;
    --mint: #7cfc9e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #060608;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(circle at 50% 42%, #12121a 0%, #060608 60%),
      #060608;
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif;
  }

  /* ambient floating sprinkles */
  .sprinkle-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .drift {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 3px;
    opacity: 0.55;
    animation: drift-up linear infinite;
  }

  @keyframes drift-up {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.5; }
    to   { transform: translateY(-110vh) rotate(200deg); opacity: 0; }
  }

  .logo-stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .glow-pulse {
    position: absolute;
    width: 340px;
    height: 340px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    background: radial-gradient(circle, rgba(255,111,176,0.30) 0%, rgba(199,125,255,0.18) 45%, transparent 72%);
    filter: blur(6px);
    animation: pulse 5s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -60%) scale(0.94); opacity: 0.75; }
    50%      { transform: translate(-50%, -60%) scale(1.06); opacity: 1; }
  }

  .donut-icon {
    width: clamp(150px, 30vw, 220px);
    height: auto;
  }

  .wordmark {
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 4.6rem);
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0;
    background: linear-gradient(100deg, var(--pink) 10%, var(--purple) 45%, var(--gold) 80%, var(--pink) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter:
      drop-shadow(0 0 14px rgba(255,111,176,0.55))
      drop-shadow(0 0 30px rgba(199,125,255,0.30));
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .drift, .glow-pulse, .wordmark { animation: none; }
  }
</style>
</head>
<body>

  <div class="sprinkle-field" id="sprinkleField"></div>

  <div class="logo-stack">
    <div class="glow-pulse"></div>

    <svg class="donut-icon" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="icing" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff8fc4"/>
          <stop offset="55%" stop-color="#c77dff"/>
          <stop offset="100%" stop-color="#8a5cf6"/>
        </linearGradient>
        <linearGradient id="drip" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffb3d9"/>
          <stop offset="100%" stop-color="#b866ff"/>
        </linearGradient>
      </defs>

      <!-- pixel-block halo (Minecraft nod) -->
      <g opacity="0.55">
        <rect x="206" y="106" width="8" height="8" fill="#e8c15a"/>
        <rect x="198.4" y="144.3" width="8" height="8" fill="#7a5230"/>
        <rect x="176.7" y="176.7" width="8" height="8" fill="#5a9c4a"/>
        <rect x="144.3" y="198.4" width="8" height="8" fill="#8a8a8a"/>
        <rect x="106" y="206" width="8" height="8" fill="#e8c15a"/>
        <rect x="67.7" y="198.4" width="8" height="8" fill="#7a5230"/>
        <rect x="35.3" y="176.7" width="8" height="8" fill="#5a9c4a"/>
        <rect x="13.6" y="144.3" width="8" height="8" fill="#8a8a8a"/>
        <rect x="6" y="106" width="8" height="8" fill="#e8c15a"/>
        <rect x="13.6" y="67.7" width="8" height="8" fill="#7a5230"/>
        <rect x="35.3" y="35.3" width="8" height="8" fill="#5a9c4a"/>
        <rect x="67.7" y="13.6" width="8" height="8" fill="#8a8a8a"/>
        <rect x="106" y="6" width="8" height="8" fill="#e8c15a"/>
        <rect x="144.3" y="13.6" width="8" height="8" fill="#7a5230"/>
        <rect x="176.7" y="35.3" width="8" height="8" fill="#5a9c4a"/>
        <rect x="198.4" y="67.7" width="8" height="8" fill="#8a8a8a"/>
      </g>

      <!-- icing drips -->
      <path d="M82,176 C80,190 82,200 90,202 C98,200 100,190 98,176 Z" fill="url(#drip)"/>
      <path d="M100,182 C98,200 100,215 110,218 C120,215 122,200 120,182 Z" fill="url(#drip)"/>
      <path d="M122,176 C120,190 122,200 130,202 C138,200 140,190 138,176 Z" fill="url(#drip)"/>

      <!-- donut ring -->
      <path d="M110 32 A78 78 0 1 0 110.01 32 Z M110 80 A30 30 0 1 1 109.99 80 Z"
            fill="url(#icing)" fill-rule="evenodd"/>

      <!-- shine -->
      <ellipse cx="80" cy="74" rx="18" ry="9" transform="rotate(-30 80 74)" fill="#ffffff" opacity="0.28"/>

      <!-- sprinkles -->
      <g stroke="none">
        <rect x="55" y="87" width="13" height="4" rx="2" fill="#4cd3ff" transform="rotate(15 61.5 89)"/>
        <rect x="71" y="65" width="13" height="4" rx="2" fill="#ffd166" transform="rotate(45 77.5 67)"/>
        <rect x="96" y="53" width="13" height="4" rx="2" fill="#7cfc9e" transform="rotate(70 102.5 55)"/>
        <rect x="122" y="55" width="13" height="4" rx="2" fill="#ffffff" transform="rotate(100 128.5 57)"/>
        <rect x="144" y="70" width="13" height="4" rx="2" fill="#ff8fc4" transform="rotate(130 150.5 72)"/>
        <rect x="155" y="94" width="13" height="4" rx="2" fill="#4cd3ff" transform="rotate(160 161.5 96)"/>
        <rect x="153" y="122" width="13" height="4" rx="2" fill="#ffd166" transform="rotate(10 159.5 124)"/>
        <rect x="137" y="144" width="13" height="4" rx="2" fill="#7cfc9e" transform="rotate(50 143.5 146)"/>
        <rect x="64" y="137" width="13" height="4" rx="2" fill="#ffffff" transform="rotate(80 70.5 139)"/>
        <rect x="55" y="118" width="13" height="4" rx="2" fill="#ff8fc4" transform="rotate(120 61.5 120)"/>
        <rect x="104" y="47" width="13" height="4" rx="2" fill="#4cd3ff" transform="rotate(5 110.5 49)"/>
      </g>
    </svg>

    <p class="wordmark">donutzach</p>
  </div>

<script>
  // scatter ambient sprinkle particles
  const colors = ['#ff6fb0', '#c77dff', '#ffd166', '#4cd3ff', '#7cfc9e'];
  const field = document.getElementById('sprinkleField');
  const count = 16;
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    d.className = 'drift';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.bottom = -10 - Math.random() * 20 + 'px';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = 9 + Math.random() * 10 + 's';
    d.style.animationDelay = Math.random() * 12 + 's';
    field.appendChild(d);
  }
</script>

</body>
</html>
