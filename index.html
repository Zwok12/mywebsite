<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>donutzach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6fb0;
    --purple: #c77dff;
    --gold: #ffd166;
    --cyan: #4cd3ff;
    --mint: #7cfc9e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #060608;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(circle at 50% 42%, #12121a 0%, #060608 60%),
      #060608;
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif;
  }

  /* ambient floating sprinkles */
  .sprinkle-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .drift {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 3px;
    opacity: 0.55;
    animation: drift-up linear infinite;
  }

  @keyframes drift-up {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.5; }
    to   { transform: translateY(-110vh) rotate(200deg); opacity: 0; }
  }

  .logo-stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .glow-pulse {
    position: absolute;
    width: 340px;
    height: 340px;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -60%);
    background: radial-gradient(circle, rgba(255,111,176,0.30) 0%, rgba(199,125,255,0.18) 45%, transparent 72%);
    filter: blur(6px);
    animation: pulse 5s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -60%) scale(0.94); opacity: 0.75; }
    50%      { transform: translate(-50%, -60%) scale(1.06); opacity: 1; }
  }

  .donut-icon {
    width: clamp(140px, 26vw, 200px);
    height: auto;
  }

  .wordmark {
    font-weight: 800;
    font-size: clamp(2.2rem, 8vw, 4.2rem);
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0;
    background: linear-gradient(100deg, var(--pink) 10%, var(--purple) 45%, var(--gold) 80%, var(--pink) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter:
      drop-shadow(0 0 14px rgba(255,111,176,0.55))
      drop-shadow(0 0 30px rgba(199,125,255,0.30));
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  /* buy button */
  .buy-btn {
    margin-top: 10px;
    padding: 16px 46px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1.05rem, 3vw, 1.4rem);
    color: #17101c;
    background: linear-gradient(100deg, var(--gold), var(--pink) 55%, var(--purple) 100%);
    background-size: 220% 100%;
    background-position: 0% 0;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    box-shadow: 0 10px 30px rgba(199,125,255,0.35);
    transition: transform .15s ease, box-shadow .25s ease, background-position .6s ease;
    -webkit-tap-highlight-color: transparent;
    min-width: 190px;
  }

  .buy-btn:hover {
    box-shadow: 0 0 24px rgba(255,209,102,0.45), 0 14px 34px rgba(199,125,255,0.45);
    background-position: 100% 0;
  }

  .buy-btn:active,
  .buy-btn.is-pressed {
    transform: scale(0.92);
    box-shadow: 0 0 44px rgba(255,209,102,0.85), 0 4px 14px rgba(199,125,255,0.5);
  }

  .buy-btn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    transform: scale(0);
    animation: ripple-expand .6s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ripple-expand {
    to { transform: scale(1); opacity: 0; }
  }

  .confetti-bit {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 5;
    animation: confetti-burst .8s ease-out forwards;
  }

  @keyframes confetti-burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .drift, .glow-pulse, .wordmark { animation: none; }
  }
</style>
</head>
<body>

  <div class="sprinkle-field" id="sprinkleField"></div>

  <div class="logo-stack">
    <div class="glow-pulse"></div>

    <svg class="donut-icon" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="icing" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff8fc4"/>
          <stop offset="55%" stop-color="#c77dff"/>
          <stop offset="100%" stop-color="#8a5cf6"/>
        </linearGradient>
        <linearGradient id="drip" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffb3d9"/>
          <stop offset="100%" stop-color="#b866ff"/>
        </linearGradient>
      </defs>

      <g opacity="0.55">
        <rect x="206" y="106" width="8" height="8" fill="#e8c15a"/>
        <rect x="198.4" y="144.3" width="8" height="8" fill="#7a5230"/>
        <rect x="176.7" y="176.7" width="8" height="8" fill="#5a9c4a"/>
        <rect x="144.3" y="198.4" width="8" height="8" fill="#8a8a8a"/>
        <rect x="106" y="206" width="8" height="8" fill="#e8c15a"/>
        <rect x="67.7" y="198.4" width="8" height="8" fill="#7a5230"/>
        <rect x="35.3" y="176.7" width="8" height="8" fill="#5a9c4a"/>
        <rect x="13.6" y="144.3" width="8" height="8" fill="#8a8a8a"/>
        <rect x="6" y="106" width="8" height="8" fill="#e8c15a"/>
        <rect x="13.6" y="67.7" width="8" height="8" fill="#7a5230"/>
        <rect x="35.3" y="35.3" width="8" height="8" fill="#5a9c4a"/>
        <rect x="67.7" y="13.6" width="8" height="8" fill="#8a8a8a"/>
        <rect x="106" y="6" width="8" height="8" fill="#e8c15a"/>
        <rect x="144.3" y="13.6" width="8" height="8" fill="#7a5230"/>
        <rect x="176.7" y="35.3" width="8" height="8" fill="#5a9c4a"/>
        <rect x="198.4" y="67.7" width="8" height="8" fill="#8a8a8a"/>
      </g>

      <path d="M82,176 C80,190 82,200 90,202 C98,200 100,190 98,176 Z" fill="url(#drip)"/>
      <path d="M100,182 C98,200 100,215 110,218 C120,215 122,200 120,182 Z" fill="url(#drip)"/>
      <path d="M122,176 C120,190 122,200 130,202 C138,200 140,190 138,176 Z" fill="url(#drip)"/>

      <path d="M110 32 A78 78 0 1 0 110.01 32 Z M110 80 A30 30 0 1 1 109.99 80 Z"
            fill="url(#icing)" fill-rule="evenodd"/>

      <ellipse cx="80" cy="74" rx="18" ry="9" transform="rotate(-30 80 74)" fill="#ffffff" opacity="0.28"/>

      <g stroke="none">
        <rect x="55" y="87" width="13" height="4" rx="2" fill="#4cd3ff" transform="rotate(15 61.5 89)"/>
        <rect x="71" y="65" width="13" height="4" rx="2" fill="#ffd166" transform="rotate(45 77.5 67)"/>
        <rect x="96" y="53" width="13" height="4" rx="2" fill="#7cfc9e" transform="rotate(70 102.5 55)"/>
        <rect x="122" y="55" width="13" height="4" rx="2" fill="#ffffff" transform="rotate(100 128.5 57)"/>
        <rect x="144" y="70" width="13" height="4" rx="2" fill="#ff8fc4" transform="rotate(130 150.5 72)"/>
        <rect x="155" y="94" width="13" height="4" rx="2" fill="#4cd3ff" transform="rotate(160 161.5 96)"/>
        <rect x="153" y="122" width="13" height="4" rx="2" fill="#ffd166" transform="rotate(10 159.5 124)"/>
        <rect x="137" y="144" width="13" height="4" rx="2" fill="#7cfc9e" transform="rotate(50 143.5 146)"/>
        <rect x="64" y="137" width="13" height="4" rx="2" fill="#ffffff" transform="rotate(80 70.5 139)"/>
        <rect x="55" y="118" width="13" height="4" rx="2" fill="#ff8fc4" transform="rotate(120 61.5 120)"/>
        <rect x="104" y="47" width="13" height="4" rx="2" fill="#4cd3ff" transform="rotate(5 110.5 49)"/>
      </g>
    </svg>

    <p class="wordmark">donutzach</p>

    <button type="button" class="buy-btn" id="buyBtn">Buy now!</button>
  </div>

<script>
  // ambient sprinkle particles
  const colors = ['#ff6fb0', '#c77dff', '#ffd166', '#4cd3ff', '#7cfc9e'];
  const field = document.getElementById('sprinkleField');
  for (let i = 0; i < 16; i++) {
    const d = document.createElement('div');
    d.className = 'drift';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.bottom = -10 - Math.random() * 20 + 'px';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = 9 + Math.random() * 10 + 's';
    d.style.animationDelay = Math.random() * 12 + 's';
    field.appendChild(d);
  }

  // buy button: press effects, goes nowhere on purpose
  const btn = document.getElementById('buyBtn');
  const originalLabel = btn.textContent;
  const messages = ['Nice try! \uD83C\uDF69', 'Still glazing...', 'Nowhere to go!', 'Sold out (jk)'];
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let resetTimer;

  btn.addEventListener('click', (e) => {
    const rect = btn.getBoundingClientRect();
    const x = e.clientX || (rect.left + rect.width / 2);
    const y = e.clientY || (rect.top + rect.height / 2);

    if (!prefersReducedMotion) {
      // ripple inside the button
      const size = Math.max(rect.width, rect.height) * 1.4;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (x - rect.left - size / 2) + 'px';
      ripple.style.top = (y - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());

      // confetti burst from the click point
      for (let i = 0; i < 18; i++) {
        const bit = document.createElement('div');
        bit.className = 'confetti-bit';
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 90;
        bit.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        bit.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        bit.style.setProperty('--rot', Math.random() * 360 + 'deg');
        bit.style.left = x + 'px';
        bit.style.top = y + 'px';
        bit.style.background = colors[i % colors.length];
        document.body.appendChild(bit);
        bit.addEventListener('animationend', () => bit.remove());
      }
    }

    // playful label swap, then revert
    btn.classList.add('is-pressed');
    btn.textContent = messages[Math.floor(Math.random() * messages.length)];
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      btn.textContent = originalLabel;
      btn.classList.remove('is-pressed');
    }, 1300);
  });
</script>

</body>
</html>
