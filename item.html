<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>donutzach — Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6fb0;
    --purple: #c77dff;
    --gold: #ffd166;
    --cyan: #4cd3ff;
    --mint: #7cfc9e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #060608;
  }

  body {
    position: relative;
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif;
    background:
      radial-gradient(circle at 50% 0%, #12121a 0%, #060608 60%),
      #060608;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .sprinkle-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .drift {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 3px;
    opacity: 0.4;
    animation: drift-up linear infinite;
  }

  @keyframes drift-up {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.45; }
    90%  { opacity: 0.35; }
    to   { transform: translateY(-110vh) rotate(200deg); opacity: 0; }
  }

  /* nav bar */
  .navbar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(8, 8, 12, 0.75);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand .donut-icon-sm {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .brand-name {
    font-weight: 800;
    font-size: 1.3rem;
    background: linear-gradient(100deg, var(--pink) 10%, var(--purple) 55%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .dropdown {
    position: relative;
  }

  .dropdown-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: #f2f2f5;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }

  .dropdown-btn:hover,
  .dropdown-btn[aria-expanded="true"] {
    border-color: var(--pink);
    background: rgba(255, 111, 176, 0.10);
  }

  .dropdown-btn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  .chevron {
    width: 10px;
    height: 10px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    transition: transform .2s ease;
    margin-top: -3px;
  }

  .dropdown-btn[aria-expanded="true"] .chevron {
    transform: rotate(225deg);
    margin-top: 3px;
  }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 200px;
    background: #0d0d12;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(199, 125, 255, 0.15);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 20;
  }

  .dropdown-menu.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dropdown-menu a {
    display: block;
    padding: 10px 14px;
    border-radius: 8px;
    color: #e8e8ee;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .dropdown-menu a:hover,
  .dropdown-menu a:focus-visible {
    background: linear-gradient(100deg, rgba(255, 111, 176, 0.18), rgba(199, 125, 255, 0.18));
    color: #ffffff;
    outline: none;
  }

  /* page body */
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18vh 20px 20px;
  }

  .hero h1 {
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 3.4rem);
    margin: 0 0 10px;
    background: linear-gradient(100deg, var(--pink) 10%, var(--purple) 45%, var(--gold) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(199, 125, 255, 0.35));
  }

  .hero p {
    color: #9a97a3;
    font-size: 1.05rem;
    max-width: 420px;
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .drift { animation: none; }
  }
</style>
</head>
<body>

  <div class="sprinkle-field" id="sprinkleField"></div>

  <nav class="navbar">
    <a class="brand" href="donutzach-buy-button.html" aria-label="donutzach home">
      <svg class="donut-icon-sm" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="icingSm" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff8fc4"/>
            <stop offset="55%" stop-color="#c77dff"/>
            <stop offset="100%" stop-color="#8a5cf6"/>
          </linearGradient>
        </defs>
        <path d="M110 32 A78 78 0 1 0 110.01 32 Z M110 80 A30 30 0 1 1 109.99 80 Z"
              fill="url(#icingSm)" fill-rule="evenodd"/>
        <ellipse cx="80" cy="74" rx="18" ry="9" transform="rotate(-30 80 74)" fill="#ffffff" opacity="0.28"/>
        <rect x="55" y="87" width="13" height="4" rx="2" fill="#4cd3ff" transform="rotate(15 61.5 89)"/>
        <rect x="122" y="55" width="13" height="4" rx="2" fill="#ffffff" transform="rotate(100 128.5 57)"/>
        <rect x="153" y="122" width="13" height="4" rx="2" fill="#ffd166" transform="rotate(10 159.5 124)"/>
      </svg>
      <span class="brand-name">donutzach</span>
    </a>

    <div class="dropdown">
      <button type="button" class="dropdown-btn" id="itemsBtn" aria-haspopup="true" aria-expanded="false">
        Items
        <span class="chevron"></span>
      </button>
      <div class="dropdown-menu" id="itemsMenu" role="menu">
        <a href="#" role="menuitem">All Items</a>
        <a href="#" role="menuitem">Weapons</a>
        <a href="#" role="menuitem">Armor</a>
        <a href="#" role="menuitem">Blocks</a>
        <a href="#" role="menuitem">Donuts 🍩</a>
      </div>
    </div>
  </nav>

  <div class="hero">
    <h1>Item Shop</h1>
    <p>Still glazing the shelves — check back soon.</p>
  </div>

<script>
  const colors = ['#ff6fb0', '#c77dff', '#ffd166', '#4cd3ff', '#7cfc9e'];
  const field = document.getElementById('sprinkleField');
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'drift';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.bottom = -10 - Math.random() * 20 + 'px';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = 10 + Math.random() * 10 + 's';
    d.style.animationDelay = Math.random() * 14 + 's';
    field.appendChild(d);
  }

  const dropBtn = document.getElementById('itemsBtn');
  const dropMenu = document.getElementById('itemsMenu');

  dropBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dropMenu.classList.toggle('open');
    dropBtn.setAttribute('aria-expanded', String(isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!dropMenu.contains(e.target) && e.target !== dropBtn) {
      dropMenu.classList.remove('open');
      dropBtn.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      dropMenu.classList.remove('open');
      dropBtn.setAttribute('aria-expanded', 'false');
    }
  });
</script>

</body>
</html>
