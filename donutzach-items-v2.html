<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>donutzach — Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6fb0;
    --purple: #c77dff;
    --gold: #ffd166;
    --cyan: #4cd3ff;
    --mint: #7cfc9e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #060608;
  }

  body {
    position: relative;
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif;
    background:
      radial-gradient(circle at 50% 0%, #12121a 0%, #060608 60%),
      #060608;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .sprinkle-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .drift {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 3px;
    opacity: 0.4;
    animation: drift-up linear infinite;
  }

  @keyframes drift-up {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.45; }
    90%  { opacity: 0.35; }
    to   { transform: translateY(-110vh) rotate(200deg); opacity: 0; }
  }

  /* nav bar */
  .navbar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(8, 8, 12, 0.75);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand .donut-icon-sm {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .brand-name {
    font-weight: 800;
    font-size: 1.3rem;
    background: linear-gradient(100deg, var(--pink) 10%, var(--purple) 55%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .dropdown {
    position: relative;
  }

  .dropdown-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: #f2f2f5;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }

  .dropdown-btn:hover,
  .dropdown-btn[aria-expanded="true"] {
    border-color: var(--pink);
    background: rgba(255, 111, 176, 0.10);
  }

  .dropdown-btn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  .chevron {
    width: 10px;
    height: 10px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    transition: transform .2s ease;
    margin-top: -3px;
  }

  .dropdown-btn[aria-expanded="true"] .chevron {
    transform: rotate(225deg);
    margin-top: 3px;
  }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 200px;
    background: #0d0d12;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(199, 125, 255, 0.15);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 20;
  }

  .dropdown-menu.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dropdown-menu a {
    display: block;
    padding: 10px 14px;
    border-radius: 8px;
    color: #e8e8ee;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .dropdown-menu a:hover,
  .dropdown-menu a:focus-visible {
    background: linear-gradient(100deg, rgba(255, 111, 176, 0.18), rgba(199, 125, 255, 0.18));
    color: #ffffff;
    outline: none;
  }

  /* page body */
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18vh 20px 20px;
  }

  .hero h1 {
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 3.4rem);
    margin: 0 0 10px;
    background: linear-gradient(100deg, var(--pink) 10%, var(--purple) 45%, var(--gold) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(199, 125, 255, 0.35));
  }

  .hero p {
    color: #9a97a3;
    font-size: 1.05rem;
    max-width: 420px;
    margin: 0;
  }

  /* market grid */
  .market-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 220px));
    justify-content: center;
    gap: 26px;
    padding: 10px 24px 90px;
  }

  .item-card {
    background: linear-gradient(160deg, #16121b, #0a090d);
    border: 3px solid #2b2b33;
    border-radius: 16px;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.55);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .item-card:hover {
    transform: translateY(-5px);
    border-color: var(--purple);
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.65), 0 0 26px rgba(199, 125, 255, 0.28);
  }

  .item-slot {
    width: 96px;
    height: 96px;
    background: #8b8b8b;
    border: 4px solid;
    border-color: #3a3a3a #d9d9d9 #d9d9d9 #3a3a3a;
    box-shadow: inset 3px 3px 0 rgba(0, 0, 0, 0.35), inset -3px -3px 0 rgba(255, 255, 255, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item-slot img {
    width: 74px;
    height: 74px;
    image-rendering: pixelated;
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.5));
  }

  .item-name {
    font-weight: 800;
    font-size: 1.15rem;
    color: #f2f2f5;
    margin: 0;
  }

  .item-price {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.85rem;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255, 209, 102, 0.55);
    margin: 0;
  }

  .item-price span {
    display: block;
    margin-top: 6px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.75rem;
    color: #8d8a94;
    text-shadow: none;
  }

  .item-buy {
    margin-top: 4px;
    padding: 9px 26px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    color: #17101c;
    background: linear-gradient(100deg, var(--gold), var(--pink) 60%, var(--purple));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(199, 125, 255, 0.3);
    transition: transform .15s ease, box-shadow .2s ease;
  }

  .item-buy:hover {
    box-shadow: 0 0 18px rgba(255, 209, 102, 0.5), 0 10px 22px rgba(199, 125, 255, 0.4);
  }

  .item-buy:active {
    transform: scale(0.92);
  }

  .item-buy:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .drift { animation: none; }
  }
</style>
</head>

<script>
  const colors = ['#ff6fb0', '#c77dff', '#ffd166', '#4cd3ff', '#7cfc9e'];
  const field = document.getElementById('sprinkleField');
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'drift';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.bottom = -10 - Math.random() * 20 + 'px';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = 10 + Math.random() * 10 + 's';
    d.style.animationDelay = Math.random() * 14 + 's';
    field.appendChild(d);
  }

  const dropBtn = document.getElementById('itemsBtn');
  const dropMenu = document.getElementById('itemsMenu');

  dropBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dropMenu.classList.toggle('open');
    dropBtn.setAttribute('aria-expanded', String(isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!dropMenu.contains(e.target) && e.target !== dropBtn) {
      dropMenu.classList.remove('open');
      dropBtn.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      dropMenu.classList.remove('open');
      dropBtn.setAttribute('aria-expanded', 'false');
    }
  });
</script>
